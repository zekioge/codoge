<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codoge — Fikirleri Koda Dönüştüren Atölye</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #08080c;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
        }

        /* Ambient Arka Plan Parıltıları */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, rgba(168, 85, 247, 0.03) 50%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- HERO & LOGO --- */
        .hero {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding: 4rem 2rem;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2.5rem;
            display: inline-block;
        }

        .hero-tag {
            background: rgba(255, 255, 255, 0.04);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid var(--glass-border);
            margin-bottom: 1.5rem;
            color: #a5b4fc;
            display: inline-block;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: 1.5rem;
            background: linear-gradient(to bottom right, #ffffff 40%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 3.5rem;
        }

        /* --- APP GRID (ICON ALANI) --- */
        .app-grid {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .app-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-icon-box {
            width: 84px;
            height: 84px;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        /* PNG İkon Stili */
        .app-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Uygulamalara Özel Premium Renkli Gölgeler */
        .app-icon-btn[data-app="mutfakdefteri"] .app-icon-box { 
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.25); 
        }
        .app-icon-btn[data-app="kitapnotlari"] .app-icon-box { 
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.25); 
        }
        .app-icon-btn[data-app="lemoney"] .app-icon-box { 
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.25); 
        }

        .app-icon-btn:hover {
            transform: translateY(-5px);
        }

        /* Hover Durumunda Parlamayı Artır */
        .app-icon-btn[data-app="mutfakdefteri"]:hover .app-icon-box { box-shadow: 0 18px 40px rgba(245, 158, 11, 0.4); }
        .app-icon-btn[data-app="kitapnotlari"]:hover .app-icon-box { box-shadow: 0 18px 40px rgba(59, 130, 246, 0.4); }
        .app-icon-btn[data-app="lemoney"]:hover .app-icon-box { box-shadow: 0 18px 40px rgba(16, 185, 129, 0.4); }

        .app-name {
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: -0.2px;
        }

        .badge-soon {
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            color: var(--text-muted);
            margin-top: -0.3rem;
        }

        /* --- POPUP (MODAL) PREMIUM DIZAYN --- */
        .modal-overlay {
            position: fixed;
            top: 0;
