<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codoge — Fikirleri Koda Dönüştüren Atölye</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #08080c;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #0066cc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Ambient Arka Plan Parıltıları */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, rgba(168, 85, 247, 0.03) 50%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- HERO & LOGO --- */
        .hero {
            max-width: 800px;
            margin: auto auto 0 auto;
            text-align: center;
            padding: 4rem 2rem 2rem 2rem;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2.5rem;
            display: inline-block;
        }

        .hero-tag {
            background: rgba(255, 255, 255, 0.04);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid var(--glass-border);
            margin-bottom: 1.5rem;
            color: #a5b4fc;
            display: inline-block;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: 1.5rem;
            background: linear-gradient(to bottom right, #ffffff 40%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 3.5rem;
        }

        /* --- APP GRID --- */
        .app-grid {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .app-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-icon-box {
            width: 84px;
            height: 84px;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .app-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .app-icon-btn[data-app="mutfakdefteri"] .app-icon-box { box-shadow: 0 12px 30px rgba(245, 158, 11, 0.25); }
        .app-icon-btn[data-app="kitapnotlari"] .app-icon-box { box-shadow: 0 12px 30px rgba(59, 130, 246, 0.25); }
        .app-icon-btn[data-app="lemoney"] .app-icon-box { box-shadow: 0 12px 30px rgba(16, 185, 129, 0.25); }

        .app-icon-btn:hover { transform: translateY(-5px); }

        .app-name { color: var(--text-main); font-size: 0.85rem; font-weight: 500; letter-spacing: -0.2px; }
        .badge-soon { font-size: 0.65rem; background: rgba(255, 255, 255, 0.1); padding: 0.1rem 0.4rem; border-radius: 4px; color: var(--text-muted); margin-top: -0.3rem; }

        /* --- PREMIUM SLIDE-OVER PANEL --- */
        .detail-panel {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #050508;
            z-index: 2000;
            display: flex;
            transition: left 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .detail-panel.open {
            left: 0;
        }

        /* Sol Alan: Bilgi Bölümü */
        .panel-left {
            width: 42%;
            min-width: 400px;
            height: 100%;
            padding: 5rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            text-align: left;
            border-right: 1px solid var(--glass-border);
            background: rgba(10, 10, 15, 0.5);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            position: relative;
        }

        /* Yenilenmiş Geri Dön Butonu */
        .panel-close-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4rem;
            transition: all 0.2s ease;
        }
        .panel-close-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(-2px);
        }

        .panel-icon {
            width: 90px; height: 90px; border-radius: 20px;
            margin-bottom: 1.8rem; border: 1px solid var(--glass-border);
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .panel-icon img { width: 100%; height: 100%; object-fit: cover; }

        .panel-title { font-size: 2.4rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: -1px; }
        .panel-desc { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 3rem; font-weight: 300; max-width: 90%; }

        /* Yenilenmiş App Store Butonu (Kusursuz Apple Standartı) */
        .btn-download {
            background: #ffffff;
            color: #000000;
            padding: 0.9rem 2.2rem;
            border-radius: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            box-shadow: 0 10px 25px rgba(255,255,255,0.08);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255,255,255,0.15);
            background: #f5f5f7;
        }
        .btn-download.disabled {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            pointer-events: none;
            box-shadow: none;
            border: 1px solid var(--glass-border);
        }

        /* Sağ Alan: Kusursuz Slide Mekanizması */
        .panel-right {
            width: 58%;
            height: 100%;
            background: #060609;
            display: flex;
            align-items: center;
            padding: 0 5rem;
            overflow-x: auto; 
            overflow-y: hidden;
            gap: 3.5rem;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory; /* Tık tık yerine oturmayı sağlayan sihirbaz */
            -webkit-overflow-scrolling: touch;
        }

        .panel-right::-webkit-scrollbar { height: 6px; }
        .panel-right::-webkit-scrollbar-track { background: transparent; }
        .panel-right::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }

        /* Ekran Görüntüsü Kutusu */
        .screenshot-holder {
            flex: 0 0 auto;
            height: 72vh;
            aspect-ratio: 9 / 19.5;
            background: rgba(255,255,255,0.01);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 35px 70px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center; /* Kaydırırken tam ortada kilitlenir */
            transition: transform 0.3s ease;
        }
        .screenshot-holder:hover {
            transform: scale(1.02);
        }

        .screenshot-holder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Resim yoksa beliren şık placeholder metni */
        .ss-error-text {
            color: rgba(255,255,255,0.15);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .panel-footer-links {
            margin-top: auto;
            display: flex;
            gap: 1.8rem;
            font-size: 0.8rem;
        }
        .panel-footer-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
        .
